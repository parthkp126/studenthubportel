    <style>
        .attendance-section {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .attendance-section h2 {
            color: #123c69;
            text-align: center;
            margin-bottom: 25px;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
        }

        .attendance-table th {
            background: #123c69;
            color: white;
            padding: 15px;
            text-align: left;
        }

        .attendance-table td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        .attendance-table tr:nth-child(even) {
            background: #f4f7fb;
        }

        .high {
            color: green;
            font-weight: bold;
        }

        .medium {
            color: orange;
            font-weight: bold;
        }

        #themeBtn {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font: inherit;
        }

        /* Attendance page dark theme */
        body.dark header,
        body.dark .attendance-section {
            background: #1e293b;
            color: #e5e7eb;
        }

        body.dark header a {
            color: #e5e7eb;
        }

        body.dark .attendance-section h2 {
            color: #bfdbfe;
        }

        body.dark .attendance-table td {
            border-color: #475569;
            color: #e5e7eb;
        }

        body.dark .attendance-table tr:nth-child(even) {
            background: #172033;
        }

        body.dark #themeBtn {
            border-color: #475569;
            background: #334155;
            color: #e5e7eb;
        }

        @media (max-width: 700px) {
            .attendance-section {
                width: 95%;
                padding: 20px;
                overflow-x: auto;
            }

            .attendance-table {
                min-width: 600px;
            }
        }
        body.dark {
    background: #0f172a;
    color: #e5e7eb;
}

body.dark footer {

    color: #e5e7eb;
}
