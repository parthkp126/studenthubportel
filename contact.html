<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Student Portal Hub</title>

    <link rel="stylesheet" href="css/style.css">


    <style>

        .contact-section {
            width: 90%;

            max-width: 700px;

            margin: 50px auto;

            padding: 40px;

            background: white;

            border-radius: 18px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }


        .contact-section h2 {
            color: #123c69;

            text-align: center;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            color: #123c69;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }


        .form-group textarea {
            resize: vertical;
        }


        .contact-buttons {
            display: flex;

            gap: 10px;
        }


        .contact-buttons input {
            width: auto;

            padding: 12px 25px;

            border: none;

            border-radius: 7px;

            cursor: pointer;
        }


        .send-btn {
            background: #123c69;

            color: white;
        }


        .clear-btn {
            background: #ddd;

            color: #222;
        }


        .college-address {
            margin-top: 35px;

            padding-top: 25px;

            border-top: 1px solid #ddd;
        }


        .college-address h3 {
            color: #123c69;

            margin-bottom: 15px;
        }


        .college-address p {
            margin: 8px 0;

            color: #555;
        }

    </style>

</head>


<body>

<header>

    <h1>Student Portal Hub</h1>

    <nav>

        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="assignment.html">Assignments</a>
        <a href="attandance.html">Attendance</a>
        <a href="faculty.html">Faculty</a>
        <a href="notic.html">Notice</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="login.html" class="login-btn">Login</a>

    </nav>

</header>


<section class="contact-section">

    <h2>Contact Us</h2>


    <form>

        <div class="form-group">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                rows="5"
                placeholder="Enter your message"
                required
            ></textarea>

        </div>


        <div class="contact-buttons">

            <input
                type="submit"
                value="Send"
                class="send-btn"
            >

            <input
                type="reset"
                value="Clear"
                class="clear-btn"
            >

        </div>

    </form>


    <div class="college-address">

        <h3>College Address</h3>

        <p>CSPIT, CHARUSAT University</p>

        <p>Changa, Anand, Gujarat</p>

        <p>Email: info@studentportalhub.com</p>

        <p>Phone: +91 9876543210</p>

    </div>

</section>


<footer>

    <p>
        © 2026 Student Portal Hub
    </p>

</footer>


</body>
</html>
