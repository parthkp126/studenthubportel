<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notice Board - Student Portal Hub</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .notice-section {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .notice-section h2 {
            color: #123c69;
            text-align: center;
            margin-bottom: 30px;
        }

        .notice-list {
            list-style: none;
            padding: 0;
        }

        .notice-list li {
            background: #f4f7fb;
            color: #444;
            padding: 18px;
            margin-bottom: 15px;
            border-left: 5px solid #1e6091;
            border-radius: 8px;
            line-height: 1.6;
            transition: 0.2s ease;
        }

        .notice-list li:hover {
            background: #e9f1f8;
            transform: translateX(5px);
        }

        .notice-title {
            display: block;
            margin-bottom: 5px;
            color: #123c69;
        }

        .notice-date {
            display: block;
            margin-top: 8px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .notice-state {
            padding: 16px;
            background: #f4f7fb;
            border-radius: 8px;
            color: #475569;
        }

        body.dark {
            background: #0f172a;
            color: #e5e7eb;
        }

        body.dark header,
        body.dark .notice-section,
        body.dark footer {
            background: #1e293b;
            color: #e5e7eb;
        }

        body.dark header a {
            color: #e5e7eb;
        }

        body.dark .notice-section h2,
        body.dark .notice-title {
            color: #bfdbfe;
        }

        body.dark .notice-list li,
        body.dark .notice-state {
            background: #172033;
            color: #e5e7eb;
            border-left-color: #60a5fa;
        }

        body.dark .notice-list li:hover {
            background: #334155;
        }

        body.dark .notice-date {
            color: #cbd5e1;
        }

        #themeBtn {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font: inherit;
        }

        body.dark #themeBtn {
            border-color: #475569;
            background: #334155;
            color: #e5e7eb;
        }

        @media (max-width: 700px) {
            .notice-section {
                width: 95%;
                padding: 22px;
            }
        }
    </style>
</head>

<body>
<header>
    <h1>Student Portal Hub</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="assignment.html">Assignments</a>
        <a href="attendance.html">Attendance</a>
        <a href="faculty.html">Faculty</a>
        <a href="notic.html" class="active">Notice</a>
        <a href="events.html">Events</a>
        <a href="profile.php">Profile</a>
        <a href="contact.html">Contact</a>
        <a href="login.php" class="login-btn">Login</a>

        <button type="button" id="themeBtn">🌙 Theme</button>
    </nav>
</header>

<main>
    <section class="notice-section">
        <h2>Notice Board</h2>

        <p id="noticeLoading" class="notice-state" aria-live="polite">
            Loading notices...
        </p>

        <p id="noticeError" class="notice-state" role="alert" hidden></p>

        <ul id="noticeList" class="notice-list" aria-live="polite"></ul>
    </section>
</main>

<footer>
    <p>© 2026 Student Portal Hub</p>
</footer>

<script>
    document.addEventListener("DOMContentLoaded", async function () {
        const list = document.getElementById("noticeList");
        const loading = document.getElementById("noticeLoading");
        const errorBox = document.getElementById("noticeError");

        try {
            const response = await fetch("notices_list.php", {
                headers: { Accept: "application/json" }
            });

            const result = await response.json();

            if (!response.ok || result.success !== true) {
                throw new Error(result.message || "Could not load notices.");
            }

            const notices = Array.isArray(result.data) ? result.data : [];
            loading.hidden = true;

            if (notices.length === 0) {
                loading.textContent = "No active notices are available.";
                loading.hidden = false;
                return;
            }

            notices.forEach(function (notice) {
                const item = document.createElement("li");

                const title = document.createElement("strong");
                title.className = "notice-title";
                title.textContent = notice.title || "Notice";

                const message = document.createElement("span");
                message.textContent = notice.message || "";

                item.append(title, message);

                if (notice.created_at) {
                    const date = document.createElement("small");
                    date.className = "notice-date";
                    date.textContent = "Posted: " + notice.created_at;
                    item.appendChild(date);
                }

                list.appendChild(item);
            });
        } catch (error) {
            console.error("Notice loading error:", error);
            loading.hidden = true;
            errorBox.textContent = "Notices could not be loaded. Please try again later.";
            errorBox.hidden = false;
        }
    });
</script>

<script src="js/script.js" defer></script>
</body>
</html>
